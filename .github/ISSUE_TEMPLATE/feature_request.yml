name: Feature request
description: Propose a useful change to a RunicTools product.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user need before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible or easier?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or context
      description: Include relevant compatibility, data, or deployment concerns.
